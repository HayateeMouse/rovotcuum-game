<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>おそうじロボット大作戦 - Robot Cleaning Adventure</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: 'Inter', sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; box-sizing: border-box; }
        .interactive { pointer-events: auto; }
        
        .split-line {
            position: absolute; top: 0; left: 50%; width: 4px; height: 100%;
            background: rgba(255, 255, 255, 0.3); transform: translateX(-50%); display: none; z-index: 6;
        }

        .joystick-zone { 
            position: absolute; width: 140px; height: 140px; 
            background: rgba(255,255,255,0.2); border-radius: 50%; 
            touch-action: none; display: none; 
            justify-content: center; align-items: center; z-index: 10; 
            pointer-events: none;
        }
        .joystick-knob { 
            width: 60px; height: 60px; background: rgba(255,255,255,0.85); 
            border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.3); pointer-events: none; 
        }
    </style>
</head>
<body>
    <div id="splitLine" class="split-line"></div>

    <div class="ui-layer">
        <div id="hud" class="flex justify-between items-center w-full max-w-6xl mx-auto bg-white/95 backdrop-blur-md px-8 py-5 rounded-3xl shadow-2xl hidden border-2 border-slate-100">
            <div class="flex items-center gap-5">
                <button onclick="openSettings()" class="interactive px-6 py-3 bg-slate-700 hover:bg-slate-800 text-white font-bold rounded-2xl text-lg shadow-lg flex flex-col items-center leading-tight transition transform active:scale-95">
                    <span>⚙️ 設定 <span class="text-xs opacity-75">Settings</span></span>
                </button>
                <div id="stageIndicator" class="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-bold text-lg shadow-lg flex flex-col items-center leading-tight">
                    <span>ステージ 1 <span class="text-xs opacity-75">Stage 1</span></span>
                </div>
            </div>
            
            <div id="bossHpContainer" class="hidden flex-col items-center bg-rose-50 border-3 border-rose-500 px-8 py-3 rounded-2xl shadow-xl">
                <span id="bossHpText" class="text-lg font-black text-rose-700">👑 ゴリラボス (HP: 100/100) <span class="text-xs opacity-75">Boss Threat</span></span>
                <div class="w-60 bg-slate-200 h-3.5 rounded-full overflow-hidden mt-2 border border-rose-300 shadow-inner">
                    <div id="bossHpBar" class="bg-rose-600 h-full w-full transition-all duration-100"></div>
                </div>
            </div>

            <div id="score1Container" class="flex items-center gap-5 bg-slate-50 px-6 py-3 rounded-2xl border border-slate-200 shadow">
                <div class="w-6 h-6 rounded-full bg-slate-900 border-2 border-white shadow"></div>
                <div class="flex flex-col leading-tight">
                    <span id="score1Text" class="text-lg font-bold text-slate-800">ゴミ: 0/10 <span class="text-xs opacity-75">Trash</span></span>
                </div>
            </div>
            <div id="score2Container" class="flex items-center gap-5 bg-slate-50 px-6 py-3 rounded-2xl border border-slate-200 shadow hidden">
                <div class="flex flex-col leading-tight text-right">
                    <span id="score2Text" class="text-lg font-bold text-slate-800">2P: 0 <span class="text-xs opacity-75">P2</span></span>
                </div>
                <div class="w-6 h-6 rounded-full bg-white border-2 border-slate-900 shadow"></div>
            </div>
        </div>

        <div id="menuScreen" class="absolute inset-0 bg-slate-900/85 backdrop-blur-sm flex flex-col justify-center items-center interactive z-30">
            <div class="bg-white p-12 rounded-3xl shadow-2xl text-center max-w-xl w-full mx-4 border-2 border-indigo-100">
                <h1 class="text-4xl font-black text-indigo-600 mb-2">🧹 おそうじロボット大作戦</h1>
                <p class="text-lg font-bold text-indigo-400 mb-10">Robot Cleaning Adventure</p>
                
                <div class="flex flex-col gap-5">
                    <button onclick="startGame(1)" class="w-full py-5 bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold text-xl rounded-2xl shadow-xl hover:scale-105 transition transform active:scale-95 flex flex-col items-center">
                        <span>👤 1人で あそぶ <span class="text-base opacity-90 font-normal">Single Player</span></span>
                    </button>
                    <button onclick="startGame(2)" class="w-full py-5 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-xl rounded-2xl shadow-xl hover:scale-105 transition transform active:scale-95 flex flex-col items-center">
                        <span>👥 2人で たいせん <span class="text-base opacity-90 font-normal">2-Player Versus</span></span>
                    </button>
                    <button onclick="openSettings()" class="w-full py-4 bg-slate-200 text-slate-700 font-bold text-lg rounded-2xl shadow hover:bg-slate-300 transition flex flex-col items-center">
                        <span>⚙️ 設定・テスト <span class="text-base opacity-80 font-normal">Settings & Test</span></span>
                    </button>
                </div>
            </div>
        </div>

        <div id="settingsScreen" class="absolute inset-0 bg-slate-900/85 backdrop-blur-sm flex flex-col justify-center items-center interactive z-35 hidden overflow-y-auto py-12">
            <div class="bg-white p-10 rounded-3xl shadow-2xl text-left max-w-2xl w-full mx-4 border-2 border-slate-200">
                <h1 class="text-2xl font-black text-slate-800 mb-6 text-center">⚙️ 設定画面 <span class="text-lg opacity-70">Settings</span></h1>
                
                <div class="mb-6">
                    <label class="block text-lg font-bold text-slate-700 mb-2">🔊 音量 / Volume: <span id="volumeValue">80</span>%</label>
                    <input type="range" id="volumeSlider" min="0" max="100" value="80" oninput="updateVolume(this.value)" class="w-full accent-indigo-600 cursor-pointer h-3">
                </div>

                <div class="mb-6">
                    <label class="block text-lg font-bold text-slate-700 mb-2">🗑️ ゴミの数 / Trash (10〜200): <span id="trashCountValue">10</span>個</label>
                    <input type="range" id="trashCountSlider" min="10" max="200" step="10" value="10" oninput="updateTrashCountSetting(this.value)" class="w-full accent-indigo-600 cursor-pointer h-3">
                </div>

                <div class="mb-6">
                    <label class="block text-lg font-bold text-slate-700 mb-2">🎮 難易度 / Difficulty Preset</label>
                    <div class="grid grid-cols-3 gap-4">
                        <button id="diffBeginner" onclick="setDifficulty('beginner')" class="py-4 bg-indigo-600 text-white font-bold rounded-2xl text-base flex flex-col items-center shadow-md">
                            <span>初級（4歳）</span><span class="text-xs opacity-90">Beginner</span>
                        </button>
                        <button id="diffIntermediate" onclick="setDifficulty('intermediate')" class="py-4 bg-slate-100 text-slate-700 font-bold rounded-2xl text-base flex flex-col items-center shadow-md">
                            <span>中級（小学生）</span><span class="text-xs opacity-80">Intermediate</span>
                        </button>
                        <button id="diffPro" onclick="setDifficulty('pro')" class="py-4 bg-slate-100 text-slate-700 font-bold rounded-2xl text-base flex flex-col items-center shadow-md">
                            <span>上級（プロ）</span><span class="text-xs opacity-80">Advanced</span>
                        </button>
                    </div>
                </div>

                <div class="mb-6 p-6 bg-slate-50 rounded-2xl border border-slate-200">
                    <label class="block text-lg font-bold text-blue-600 mb-2">🤖 1P スピード (1.5-10.0): <span id="p1SpeedVal">1.50</span></label>
                    <input type="range" id="p1SpeedSlider" min="1.5" max="10.0" step="0.1" value="1.50" oninput="updateP1Speed(this.value)" class="w-full accent-blue-600 cursor-pointer h-3">
                    
                    <label class="block text-lg font-bold text-red-600 mt-5 mb-2">🤖 2P スピード (1.5-10.0): <span id="p2SpeedVal">1.50</span></label>
                    <input type="range" id="p2SpeedSlider" min="1.5" max="10.0" step="0.1" value="1.50" oninput="updateP2Speed(this.value)" class="w-full accent-red-600 cursor-pointer h-3">
                </div>

                <div class="mb-6 pt-5 border-t border-slate-200 flex items-center justify-between">
                    <div>
                        <span class="block text-lg font-bold text-slate-500">🧪 テストコード (061606)</span>
                        <span class="text-base text-slate-400">Secret Test Code</span>
                    </div>
                    <div class="flex gap-4 items-center">
                        <input type="password" id="secretCodeInput" maxlength="6" placeholder="******" class="w-36 px-4 py-3 border border-slate-300 rounded-2xl text-center tracking-widest font-bold text-slate-700 text-lg shadow-inner">
                        <button onclick="checkSecretCode()" class="px-6 py-3 bg-slate-800 text-white font-bold rounded-2xl hover:bg-slate-700 text-base shadow">
                            <span>認証 <span class="text-xs opacity-75">Auth</span></span>
                        </button>
                    </div>
                </div>

                <button onclick="closeSettings()" class="w-full py-4 bg-indigo-600 text-white font-bold text-lg rounded-2xl shadow-lg hover:bg-indigo-700 flex flex-col items-center">
                    <span>もどる / Back</span>
                </button>
            </div>
        </div>

        <div id="stageSelectScreen" class="absolute inset-0 bg-slate-900/85 backdrop-blur-sm flex flex-col justify-center items-center interactive z-35 hidden">
            <div class="bg-white p-10 rounded-3xl shadow-2xl text-center max-w-lg w-full mx-4 border-2 border-amber-200">
                <h1 class="text-2xl font-black text-amber-600 mb-2">🧪 ステージ選択 <span class="text-lg opacity-75">Test Stage Select</span></h1>
                <p class="text-lg text-amber-500 font-semibold mb-6">モード / Mode: <span id="testModeDisplay" class="font-bold text-indigo-600">1人プレイ</span> <button onclick="toggleTestMode()" class="underline text-indigo-500 ml-2">(切替/Switch)</button></p>
                <div class="grid grid-cols-1 gap-4 mb-6">
                    <button onclick="startTestStage(1)" class="py-4 bg-blue-500 text-white font-bold rounded-2xl text-lg shadow">ステージ 1 (通常) / Normal</button>
                    <button onclick="startTestStage(2)" class="py-4 bg-indigo-500 text-white font-bold rounded-2xl text-lg shadow">ステージ 2 (落とし穴) / Holes</button>
                    <button onclick="startTestStage(3)" class="py-4 bg-amber-500 text-white font-bold rounded-2xl text-lg shadow">ステージ 3 (爆弾) / Bombs</button>
                    <button onclick="startTestStage(4)" class="py-4 bg-purple-500 text-white font-bold rounded-2xl text-lg shadow">ステージ 4 (お邪魔) / Enemies</button>
                    <button onclick="startTestStage(5)" class="py-4 bg-rose-500 text-white font-bold rounded-2xl text-lg shadow">ステージ 5 (ボス戦) / Boss Fight</button>
                </div>
                <button onclick="returnToMenu()" class="w-full py-4 bg-slate-600 text-white font-bold text-lg rounded-2xl">メニューに戻る / Menu</button>
            </div>
        </div>

        <div id="resultScreen" class="absolute inset-0 bg-slate-900/85 backdrop-blur-sm flex flex-col justify-center items-center interactive z-35 hidden">
            <div class="bg-white p-12 rounded-3xl shadow-2xl text-center max-w-lg w-full mx-4 border-2 border-yellow-200">
                <h1 id="resultTitle" class="text-2xl font-black text-yellow-500 mb-2">🏆 ステージクリア！</h1>
                <p id="resultSubtitle" class="text-lg font-bold text-yellow-600 mb-3">Stage Cleared!</p>
                <p id="resultMessage" class="text-lg font-bold text-slate-700 mb-8">おめでとう！ Great Job!</p>
                <div class="flex flex-col gap-5">
                    <button id="nextStageBtn" onclick="nextStage()" class="w-full py-5 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-lg rounded-2xl shadow-xl flex flex-col items-center">
                        <span>➡️ つぎのステージへ <span class="text-base opacity-80">Next Stage</span></span>
                    </button>
                    <button onclick="returnToMenu()" class="w-full py-5 bg-slate-700 text-white font-bold text-lg rounded-2xl shadow-xl flex flex-col items-center">
                        <span>🏠 メニューにもどる <span class="text-base opacity-80">Main Menu</span></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="joystickZone1" class="joystick-zone">
        <div id="joystickKnob1" class="joystick-knob"></div>
    </div>
    <div id="joystickZone2" class="joystick-zone">
        <div id="joystickKnob2" class="joystick-knob"></div>
    </div>

    <script>
        let audioCtx = null;
        let globalVolume = 0.8;
        let userTrashCount = 10;
        let currentDifficulty = 'beginner';
        let customP1Speed = 1.50;
        let customP2Speed = 1.50;
        const arenaSize = 1800;

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function updateVolume(val) {
            globalVolume = val / 100;
            document.getElementById('volumeValue').innerText = val;
        }

        function updateTrashCountSetting(val) {
            userTrashCount = parseInt(val);
            document.getElementById('trashCountValue').innerText = val;
        }

        function updateP1Speed(val) {
            customP1Speed = parseFloat(val);
            document.getElementById('p1SpeedVal').innerText = customP1Speed.toFixed(2);
        }

        function updateP2Speed(val) {
            customP2Speed = parseFloat(val);
            document.getElementById('p2SpeedVal').innerText = customP2Speed.toFixed(2);
        }

        function setDifficulty(level) {
            currentDifficulty = level;
            ['beginner', 'intermediate', 'pro'].forEach(lvl => {
                const btn = document.getElementById(`diff${lvl.charAt(0).toUpperCase() + lvl.slice(1)}`);
                if (lvl === level) {
                    btn.className = 'py-4 bg-indigo-600 text-white font-bold rounded-2xl text-base flex flex-col items-center shadow-md';
                } else {
                    btn.className = 'py-4 bg-slate-100 text-slate-700 font-bold rounded-2xl text-base flex flex-col items-center shadow-md';
                }
            });

            if (level === 'beginner') {
                customP1Speed = 1.50; customP2Speed = 1.50;
            } else if (level === 'intermediate') {
                customP1Speed = 4.50; customP2Speed = 4.50;
            } else if (level === 'pro') {
                customP1Speed = 8.50; customP2Speed = 8.50;
            }
            document.getElementById('p1SpeedSlider').value = customP1Speed;
            document.getElementById('p1SpeedVal').innerText = customP1Speed.toFixed(2);
            document.getElementById('p2SpeedSlider').value = customP2Speed;
            document.getElementById('p2SpeedVal').innerText = customP2Speed.toFixed(2);
        }

        function playPopSound() {
            initAudioContext();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1400, now);
            osc.frequency.exponentialRampToValueAtTime(3600, now + 0.25);
            gain.gain.setValueAtTime(800000.0 * globalVolume, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
        }

        function playExplosionSound() {
            initAudioContext();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 2.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.4));
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(3000, now);
            filter.frequency.linearRampToValueAtTime(30, now + 2.5);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(80.0 * globalVolume, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start(now);
        }

        function playCartoonFallSound() {
            initAudioContext();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(1800, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 1.2);

            gain.gain.setValueAtTime(60.0 * globalVolume, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 1.2);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 1.2);
        }

        let vacuumNode = null;
        let vacuumGain = null;
        let isVacuumPlaying = false;

        function startVacuumSound() {
            initAudioContext();
            if (!audioCtx || isVacuumPlaying) return;
            isVacuumPlaying = true;
            try {
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1);
                }
                vacuumNode = audioCtx.createBufferSource();
                vacuumNode.buffer = buffer;
                vacuumNode.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(2500, audioCtx.currentTime);
                filter.Q.setValueAtTime(3, audioCtx.currentTime);

                vacuumGain = audioCtx.createGain();
                vacuumGain.gain.setValueAtTime(0.000000001 * globalVolume, audioCtx.currentTime);

                vacuumNode.connect(filter);
                filter.connect(vacuumGain);
                vacuumGain.connect(audioCtx.destination);
                vacuumNode.start();
            } catch (e) {
                isVacuumPlaying = false;
            }
        }

        function stopVacuumSound() {
            if (!isVacuumPlaying || !vacuumNode) return;
            try {
                vacuumNode.stop();
                vacuumNode.disconnect();
            } catch (e) {}
            isVacuumPlaying = false;
            vacuumNode = null;
        }

        let scene, camera, renderer;
        let robots = [];
        let trashes = [];
        let holes = [];
        let bombs = [];
        let enemies = [];
        let boss = null;
        let fireballs = [];
        let effects = [];
        let tireTracks = [];
        
        let keys = {};
        let activeTouches = {};
        
        let isGameStarted = false;
        let isGameCleared = false;
        let playerMode = 1;
        let currentStage = 1;
        const totalStages = 5;

        let clock = new THREE.Clock();

        function openSettings() {
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('stageSelectScreen').classList.add('hidden');
            document.getElementById('settingsScreen').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsScreen').classList.add('hidden');
            document.getElementById('menuScreen').classList.remove('hidden');
        }

        let testModePlayerCount = 1;
        function toggleTestMode() {
            testModePlayerCount = testModePlayerCount === 1 ? 2 : 1;
            document.getElementById('testModeDisplay').innerText = testModePlayerCount === 1 ? '1人プレイ' : '2人プレイ';
        }

        function checkSecretCode() {
            const codeInput = document.getElementById('secretCodeInput').value;
            if (codeInput === '061606') {
                initAudioContext();
                document.getElementById('settingsScreen').classList.add('hidden');
                document.getElementById('stageSelectScreen').classList.remove('hidden');
            } else {
                alert('コードが違います (Wrong Code)');
            }
        }

        function startTestStage(stageNum) {
            initAudioContext();
            playerMode = testModePlayerCount;
            currentStage = stageNum;

            isGameStarted = true;
            isGameCleared = false;
            clock.start();

            document.getElementById('stageSelectScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            const splitLine = document.getElementById('splitLine');
            if (playerMode === 1) {
                document.getElementById('score2Container').classList.add('hidden');
                splitLine.style.display = 'none';
            } else {
                document.getElementById('score2Container').classList.remove('hidden');
                splitLine.style.display = 'block';
            }

            setupStage();
        }

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.FogExp2(0x1a1a2e, 0.0003);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 8000);
            camera.position.set(0, 700, 600);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
            dirLight.position.set(400, 800, 400);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createRoom();
            setupInput();

            window.addEventListener('resize', onWindowResize);
        }

        function createRoom() {
            const floorGeo = new THREE.PlaneGeometry(arenaSize, arenaSize);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x222831, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x393e46, roughness: 0.5 });
            const transWallMat = new THREE.MeshStandardMaterial({ color: 0x393e46, transparent: true, opacity: 0.15, roughness: 0.5 });
            const half = arenaSize / 2;

            const north = new THREE.Mesh(new THREE.BoxGeometry(arenaSize, 50, 10), wallMat);
            north.position.set(0, 25, -half);
            scene.add(north);

            const south = new THREE.Mesh(new THREE.BoxGeometry(arenaSize, 50, 10), transWallMat);
            south.position.set(0, 25, half);
            scene.add(south);

            const west = new THREE.Mesh(new THREE.BoxGeometry(10, 50, arenaSize), wallMat);
            west.position.set(-half, 25, 0);
            scene.add(west);

            const east = new THREE.Mesh(new THREE.BoxGeometry(10, 50, arenaSize), wallMat);
            east.position.set(half, 25, 0);
            scene.add(east);
        }

        function startGame(mode) {
            initAudioContext();
            playerMode = mode;
            currentStage = 1;

            isGameStarted = true;
            isGameCleared = false;
            clock.start();

            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');

            const splitLine = document.getElementById('splitLine');
            if (playerMode === 1) {
                document.getElementById('score2Container').classList.add('hidden');
                splitLine.style.display = 'none';
            } else {
                document.getElementById('score2Container').classList.remove('hidden');

        function nextStage() {
            currentStage++;
            if (currentStage > totalStages) {
                currentStage = totalStages;
            }
            isGameCleared = false;
            document.getElementById('resultScreen').classList.add('hidden');
            setupStage();
        }

        function returnToMenu() {
            stopVacuumSound();

            isGameCleared = false;

            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('stageSelectScreen').classList.add('hidden');
            document.getElementById('settingsScreen').classList.add('hidden');

        function clearStageObjects() {
            trashes.forEach(t => scene.remove(t.mesh));
            trashes = [];
            holes.forEach(h => scene.remove(h.mesh));
            holes = [];
            bombs.forEach(b => scene.remove(b.mesh));
            bombs = [];
            enemies.forEach(e => scene.remove(e.mesh));
            enemies = [];
            fireballs.forEach(f => scene.remove(f.mesh));
            fireballs = [];
            effects.forEach(ef => scene.remove(ef.mesh));
            effects = [];
            tireTracks.forEach(tr => scene.remove(tr.mesh));

        function setupStage() {
            clearStageObjects();
            document.getElementById('stageIndicator').innerHTML = `<span>ステージ ${currentStage} <span class='text-xs opacity-75'>Stage ${currentStage}</span></span>`;

            if (currentStage === 5) {
                document.getElementById('bossHpContainer').classList.remove('hidden');
            } else {
                document.getElementById('bossHpContainer').classList.add('hidden');
            }

            robots.forEach(r => scene.remove(r.mesh));
            robots = [];
            
            robots.push({
                mesh: createRobotMesh(0x111111, 0x3b82f6, 'boy'),
                pos: new THREE.Vector3(-250, 0, 0),
                velocity: new THREE.Vector3(0, 0, 0),
                score: 0,
                id: 1,
                freezeTimer: 0,
                invincibleTimer: 0,
                flipTimer: 0,
                rotationAngle: 0,
                radius: 22.4 * 0.8 * 0.8
            });

            if (playerMode === 2) {
                robots.push({
                    mesh: createRobotMesh(0xf8fafc, 0xef4444, 'girl'),
                    pos: new THREE.Vector3(250, 0, 0),
                    velocity: new THREE.Vector3(0, 0, 0),
                    score: 0,
                    id: 2,
                    freezeTimer: 0,
                    invincibleTimer: 0,
                    flipTimer: 0,
                    rotationAngle: 0,
                    radius: 22.4 * 0.8 * 0.8
                });
            }
            robots.forEach(r => {
                r.pos.y = 0;
                r.mesh.position.copy(r.pos);
                scene.add(r.mesh);
            });

            if (currentStage >= 2) createHoles();
            if (currentStage >= 3) createBombs();
            if (currentStage >= 4) createEnemies();
            if (currentStage === 5) createBoss();

            createTrashes();
            updateHUD();
        }

        function getDifficultyCounts() {
            if (currentDifficulty === 'beginner') return { holes: 3, bombs: 3, enemies: 3, bossCd: 3.5 };
            if (currentDifficulty === 'intermediate') return { holes: 6, bombs: 6, enemies: 6, bossCd: 2.5 };
            return { holes: 9, bombs: 9, enemies: 9, bossCd: 1.8 };
        }

        function createHoles() {
            const counts = getDifficultyCounts();
            // Hole size doubled (2x) based on previous instruction
            const holeGeo = new THREE.CylinderGeometry(140.0 * 2.0 * 0.5 * 0.5 * 0.5 * 2.0 * 2.0, 140.0 * 2.0 * 0.5 * 0.5 * 0.5 * 2.0 * 2.0, 0.8, 32);
            const holeMat = new THREE.MeshBasicMaterial({ color: 0x0f172a, polygonOffset: true, polygonOffsetUnits: -6 });

            for (let i = 0; i < counts.holes; i++) {
                const mesh = new THREE.Mesh(holeGeo, holeMat);
                let x, z;
                let attempts = 0;
                do {
                    x = (Math.random() - 0.5) * (arenaSize - 200);
                    z = (Math.random() - 0.5) * (arenaSize - 200);
                    attempts++;
                } while ((Math.hypot(x + 250, z) < 250 || Math.hypot(x - 250, z) < 250) && attempts < 50);

                mesh.position.set(x, 1.2, z);
                scene.add(mesh);
                holes.push({ mesh: mesh, radius: 136.0 * 0.5 * 0.5 * 0.5 * 2.0 * 2.0 });
            }
        }

            bombGroup.scale.set(1.6875 * 0.75 * 0.5 * 2.0 * 2.0 * 0.5 * 0.5 * 2.0, 1.6875 * 0.75 * 0.5 * 2.0 * 2.0 * 0.5 * 0.5 * 2.0, 1.6875 * 0.75 * 0.5 * 2.0 * 2.0 * 0.5 * 0.5 * 2.0);

            for (let i = 0; i < counts.bombs; i++) {

                let x, z;
                let attempts = 0;
                do {
                    x = (Math.random() - 0.5) * (arenaSize - 200);
                    z = (Math.random() - 0.5) * (arenaSize - 200);
                    attempts++;
                } while ((Math.hypot(x + 250, z) < 250 || Math.hypot(x - 250, z) < 250 || 
                          holes.some(h => h.mesh.position.distanceTo(new THREE.Vector3(x,0,z)) < h.radius + 30)) && attempts < 50);

                mesh.position.set(x, 0, z);
                scene.add(mesh);
                bombs.push({ mesh: mesh });

        function createEnemies() {
            const counts = getDifficultyCounts();
            const enemyGroup = new THREE.Group();
            // Enemies doubled (2x) per latest instruction
            enemyGroup.scale.set(1.6875 * 0.75 * 0.5 * 2.0 * 2.0 * 0.5 * 0.5 * 2.0, 1.6875 * 0.75 * 0.5 * 2.0 * 2.0 * 0.5 * 0.5 * 2.0, 1.6875 * 0.75 * 0.5 * 2.0 * 2.0 * 0.5 * 0.5 * 2.0);
            const bodyGeo = new THREE.SphereGeometry(28.0, 16, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.1, emissive: 0x990000 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 28.0;
            enemyGroup.add(body);

            const spikeGeo = new THREE.ConeGeometry(7.0, 34.0, 6);
            const spikeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, metalness: 0.8, roughness: 0.2 });
            
            for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
                for (let phi = 0.4; phi <= Math.PI; phi += Math.PI / 2) {
                    const s = new THREE.Mesh(spikeGeo, spikeMat);
                    s.position.set(Math.cos(angle) * Math.sin(phi) * 28.0, 28.0 + Math.cos(phi) * 28.0, Math.sin(angle) * Math.sin(phi) * 28.0);
                    s.lookAt(s.position.clone().multiplyScalar(2));
                    enemyGroup.add(s);
                }
            }

            for (let i = 0; i < counts.enemies; i++) {
                const mesh = enemyGroup.clone();
                let x, z;
                let attempts = 0;
                do {
                    x = (Math.random() - 0.5) * (arenaSize - 200);
                    z = (Math.random() - 0.5) * (arenaSize - 200);
                    attempts++;
                } while ((Math.hypot(x + 250, z) < 250 || Math.hypot(x - 250, z) < 250 ||
                          holes.some(h => h.mesh.position.distanceTo(new THREE.Vector3(x,0,z)) < h.radius + 30)) && attempts < 50);

                mesh.position.set(x, 0, z);
                scene.add(mesh);

                const angle = Math.random() * Math.PI * 2;
                const dir = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle)).normalize();

                enemies.push({
                    mesh: mesh,
                    dir: dir,
                    speed: 2.0
                });
            }
        }

        function createTrashes() {
            const colors = [0xef4444, 0x3b82f6, 0xeab308, 0x10b981, 0xec4899];
            const geometries = [
                () => new THREE.BoxGeometry(72.0 * 2.0 * 0.5 * 2.0 * 0.5 * 0.5 * 2.0 * 0.5, 72.0 * 2.0 * 0.5 * 2.0 * 0.5 * 0.5 * 2.0 * 0.5, 72.0 * 2.0 * 0.5 * 2.0 * 0.5 * 0.5 * 2.0 * 0.5),
                () => new THREE.SphereGeometry(44.0 * 2.0 * 0.5 * 2.0 * 0.5 * 0.5 * 2.0 * 0.5, 16, 16),
                () => new THREE.ConeGeometry(44.0 * 2.0 * 0.5 * 2.0 * 0.5 * 0.5 * 2.0 * 0.5, 76.0 * 2.0 * 0.5 * 2.0 * 0.5 * 0.5 * 2.0 * 0.5, 16)
            ];

            for (let i = 0; i < userTrashCount; i++) {
                const geoFn = geometries[Math.floor(Math.random() * geometries.length)];
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
                const mesh = new THREE.Mesh(geoFn(), mat);

                let x, z;
                let valid = false;
                let attempts = 0;
                while (!valid && attempts < 100) {
                    attempts++;
                    x = (Math.random() - 0.5) * (arenaSize - 200);
                    z = (Math.random() - 0.5) * (arenaSize - 200);
                    
                    valid = true;
                    for (let hole of holes) {
                        if (hole.mesh.position.distanceTo(new THREE.Vector3(x, 0, z)) < hole.radius + 20.0) {
                            valid = false;
                            break;
                        }
                    }
                }

                mesh.position.set(x, 36.0 * 0.5 * 0.5, z);
                mesh.castShadow = true;

                scene.add(mesh);
                trashes.push({ mesh: mesh, collected: false });
            }
        }

        function setupInput() {
            window.addEventListener('keydown', (e) => keys[e.code] = true);
            window.addEventListener('keyup', (e) => keys[e.code] = false);

            document.body.addEventListener('touchstart', (e) => {
                if (!isGameStarted || isGameCleared) return;
                initAudioContext();

                const screenW = window.innerWidth;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.target.tagName === 'BUTTON' || touch.target.tagName === 'INPUT') continue;

                    let zoneEl = document.getElementById('joystickZone1');
                    let knobEl = document.getElementById('joystickKnob1');

                    let player = 1;
                    if (playerMode === 2) {
                        if (touch.clientX > screenW / 2) {
                            player = 2;
                            zoneEl = document.getElementById('joystickZone2');
                            knobEl = document.getElementById('joystickKnob2');
                        }
                    } else {
                        if (touch.clientX > screenW / 2) {
                            player = 1;
                            zoneEl = document.getElementById('joystickZone1');
                            knobEl = document.getElementById('joystickKnob1');
                        }
                    }

                    if (!activeTouches[touch.identifier]) {
                        const center = { x: touch.clientX, y: touch.clientY };
                        zoneEl.style.display = 'flex';
                        zoneEl.style.left = (center.x - 70) + 'px';
                        zoneEl.style.top = (center.y - 70) + 'px';
                        knobEl.style.transform = `translate(0px, 0px)`;

                        activeTouches[touch.identifier] = { player, zoneEl, knobEl, center, deltaX: 0, deltaZ: 0 };
                        updateJoystickMove(touch, activeTouches[touch.identifier]);
                    }
                }
            }, { passive: false });

            document.body.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const info = activeTouches[touch.identifier];
                    if (info) {
                        e.preventDefault();
                        updateJoystickMove(touch, info);
                    }
                }
            }, { passive: false });

            const endTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const info = activeTouches[touch.identifier];
                    if (info) {
                        info.zoneEl.style.display = 'none';
                        delete activeTouches[touch.identifier];
                    }
                }
            };

            document.body.addEventListener('touchend', endTouch);
            document.body.addEventListener('touchcancel', endTouch);

            function updateJoystickMove(touch, info) {
                const dx = touch.clientX - info.center.x;
                const dy = touch.clientY - info.center.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const maxDist = 40;
                let nx = dx, ny = dy;
                if (dist > maxDist) {
                    nx = (dx / dist) * maxDist;
                    ny = (dy / dist) * maxDist;
                }
                info.knobEl.style.transform = `translate(${nx}px, ${ny}px)`;

                info.deltaX = dx / maxDist;
                info.deltaZ = dy / maxDist;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            let delta = clock.getDelta();
            if (delta > 0.1) delta = 0.1;

            if (isGameStarted && !isGameCleared) {
                updateGame(delta);
            }

            renderer.render(scene, camera);
        }

        function updateGame(delta) {
            const speedFactor = delta * 60;
            const friction = Math.pow(0.82, speedFactor); 
            let movingAny = false;

            for (let i = tireTracks.length - 1; i >= 0; i--) {
                const tr = tireTracks[i];
                tr.opacity -= delta * 0.03;
                tr.mesh.material.opacity = Math.max(0, tr.opacity);
                if (tr.opacity <= 0) {
                    scene.remove(tr.mesh);
                    tireTracks.splice(i, 1);
                }
            }

            for (let i = effects.length - 1; i >= 0; i--) {
                const ef = effects[i];
                ef.timer -= delta;
                if (ef.type === 'explosion') {
                    ef.mesh.scale.addScalar(delta * 14);
                    ef.mesh.material.opacity = ef.timer * 2;
                } else if (ef.type === 'flash') {
                    ef.mesh.scale.addScalar(delta * 12);
                    ef.mesh.material.opacity = ef.timer * 2;
                }
                if (ef.timer <= 0) {
                    scene.remove(ef.mesh);
                    effects.splice(i, 1);
                }
            }

            const counts = getDifficultyCounts();
            if (currentStage === 5 && boss) {
                boss.actionTimer += delta;
                boss.fireCooldown += delta;

                if (boss.actionTimer > 5.0) {
                    boss.actionTimer = 0;
                    boss.pos.x = (Math.random() - 0.5) * (arenaSize - 300);
                    boss.pos.z = (Math.random() - 0.5) * (arenaSize - 300);
                    boss.mesh.position.copy(boss.pos);
                    boss.mesh.position.y = 0;
                }

                if (boss.fireCooldown > counts.bossCd && boss.hp > 0) {
                    boss.fireCooldown = 0;
                    const fireballGeo = new THREE.SphereGeometry(140.0 * 0.5 * 0.7 * 0.7 * 0.7 * 0.7, 16, 16);
                    const fireballMat = new THREE.MeshBasicMaterial({ color: 0xf97316 });
                    const fireballMesh = new THREE.Mesh(fireballGeo, fireballMat);
                    fireballMesh.position.copy(boss.pos);
                    fireballMesh.position.y = 35.0;
                    scene.add(fireballMesh);

                    const targetPos = robots[0].pos;
                    const fireDir = new THREE.Vector3().subVectors(targetPos, boss.pos).normalize();
                    fireballs.push({ mesh: fireballMesh, velocity: fireDir.multiplyScalar(4.0) });
                }
            }

            for (let i = fireballs.length - 1; i >= 0; i--) {
                const fb = fireballs[i];
                fb.mesh.position.addScaledVector(fb.velocity, speedFactor);
                fb.mesh.position.y = 35.0;

                robots.forEach(robot => {
                    if (robot.pos.distanceTo(fb.mesh.position) < 65.0 && robot.freezeTimer <= 0 && robot.invincibleTimer <= 0) {
                        playExplosionSound();
                        spawn3DфераExplosion(fb.mesh.position, 0xff5500, 3.0);
                        robot.freezeTimer = 1.5;
                        robot.invincibleTimer = 3.0;
                        robot.flipTimer = 1.5;

                        const pushDir = new THREE.Vector3().subVectors(robot.pos, fb.mesh.position).normalize();
                        robot.velocity.addScaledVector(pushDir, 18.0);

                        scene.remove(fb.mesh);
                        fireballs.splice(i, 1);
                    }
                });
            }

            enemies.forEach(en => {
                const limit = arenaSize / 2 - 50;
                en.mesh.position.addScaledVector(en.dir, (en.speed * 3.5) * speedFactor);
                en.mesh.position.y = 0;

                if (Math.abs(en.mesh.position.x) > limit || Math.abs(en.mesh.position.z) > limit) {
                    en.dir.negate();
                    en.mesh.position.addScaledVector(en.dir, 15);
                }
            });

            robots.forEach((robot, idx) => {
                const maxSpeed = (idx === 0) ? customP1Speed : customP2Speed;
                const acceleration = maxSpeed * 0.35 * speedFactor;

                const normalGroup = robot.mesh.getObjectByName('normalGroup');
                const flippedGroup = robot.mesh.getObjectByName('flippedGroup');
                const leftB = robot.mesh.getObjectByName('sideBrushLeft');
                const rightB = robot.mesh.getObjectByName('sideBrushRight');
                
                if (leftB && rightB) {
                    leftB.rotation.y += 3.5 * speedFactor;
                    rightB.rotation.y -= 3.5 * speedFactor;
                }

                const eyeGroup = robot.mesh.getObjectByName('eyeGroup');
                if (eyeGroup) {
                    const blinkCycle = (Date.now() % 4000) / 4000;
                    eyeGroup.scale.y = blinkCycle < 0.1 ? 0.15 : 1.0;
                }

                if (robot.flipTimer > 0) {
                    robot.flipTimer -= delta;
                    normalGroup.visible = false;
                    flippedGroup.visible = true;

                    const totalTime = 1.5;
                    const progress = 1.0 - (robot.flipTimer / totalTime);
                    
                    // Exactly 1 full rotation (Math.PI * 2.0) for the flip-over animation
                    if (progress < 0.8) {
                        const jumpP = progress / 0.8;
                        robot.pos.y = Math.sin(jumpP * Math.PI) * 160.0; 
                        robot.mesh.rotation.x = jumpP * Math.PI * 2.0;
                        robot.mesh.rotation.z = 0;
                    } else {
                        robot.pos.y = 8.0;
                        robot.mesh.rotation.x = Math.PI * 2.0;
                        robot.mesh.rotation.z = 0;
                    }
                } else {
                    robot.pos.y = 0;
                    robot.mesh.rotation.x = 0;
                    robot.mesh.rotation.z = 0;
                    normalGroup.visible = true;
                    flippedGroup.visible = false;
                }

                if (robot.invincibleTimer > 0) {
                    robot.invincibleTimer -= delta;
                    robot.mesh.visible = Math.floor(robot.invincibleTimer * 10) % 2 === 0;
                } else {
                    robot.mesh.visible = true;
                }

                if (robot.freezeTimer > 0) {
                    robot.freezeTimer -= delta;
                    robot.velocity.set(0, 0, 0);
                    robot.mesh.position.copy(robot.pos);
                    return;
                }

                let dir = new THREE.Vector3(0, 0, 0);
                if (idx === 0) {
                    if (keys['ArrowUp'] || (keys['KeyW'] && playerMode === 1)) dir.z -= 1;
                    if (keys['ArrowDown'] || (keys['KeyS'] && playerMode === 1)) dir.z += 1;
                    if (keys['ArrowLeft'] || (keys['KeyA'] && playerMode === 1)) dir.x -= 1;
                    if (keys['ArrowRight'] || (keys['KeyD'] && playerMode === 1)) dir.x += 1;
                    
                    for (let id in activeTouches) {
                        if (activeTouches[id].player === 1) {
                            dir.x += activeTouches[id].deltaX;
                            dir.z += activeTouches[id].deltaZ;
                        }
                    }
                } else if (idx === 1) {
                    if (keys['KeyW']) dir.z -= 1;
                    if (keys['KeyS']) dir.z += 1;
                    if (keys['KeyA']) dir.x -= 1;
                    if (keys['KeyD']) dir.x += 1;
                    
                    for (let id in activeTouches) {
                        if (activeTouches[id].player === 2) {
                            dir.x += activeTouches[id].deltaX;
                            dir.z += activeTouches[id].deltaZ;
                        }
                    }
                }

                if (dir.lengthSq() > 0) {
                    dir.normalize();
                    robot.velocity.addScaledVector(dir, acceleration);
                    
                    if (robot.velocity.length() > maxSpeed) {
                        robot.velocity.setLength(maxSpeed);
                    }

                    movingAny = true;

                    const targetAngle = Math.atan2(dir.x, dir.z);
                    let angleDiff = targetAngle - robot.rotationAngle;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    robot.rotationAngle += angleDiff * 0.5;
                    if (robot.flipTimer <= 0) {
                        robot.mesh.rotation.y = robot.rotationAngle;
                    }

                    if (Math.random() < 0.3 && robot.flipTimer <= 0) {
                        const leftOffset = new THREE.Vector3(-14, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), robot.rotationAngle);
                        const rightOffset = new THREE.Vector3(14, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), robot.rotationAngle);
                        spawnTireTrack(robot.pos.clone().add(leftOffset));
                        spawnTireTrack(robot.pos.clone().add(rightOffset));
                    }
                }

                robot.velocity.multiplyScalar(friction);
                robot.pos.addScaledVector(robot.velocity, speedFactor);
                if (robot.flipTimer <= 0) robot.pos.y = 0;

                const limit = arenaSize / 2 - 30;
                if (robot.pos.x < -limit) { robot.pos.x = -limit; robot.velocity.x *= -0.5; }
                if (robot.pos.x > limit) { robot.pos.x = limit; robot.velocity.x *= -0.5; }
                if (robot.pos.z < -limit) { robot.pos.z = -limit; robot.velocity.z *= -0.5; }
                if (robot.pos.z > limit) { robot.pos.z = limit; robot.velocity.z *= -0.5; }

                robot.mesh.position.copy(robot.pos);

                if (currentStage >= 2 && robot.flipTimer <= 0) {
                    holes.forEach(hole => {
                        if (robot.pos.distanceTo(hole.mesh.position) < hole.radius && robot.invincibleTimer <= 0) {
                            playCartoonFallSound();
                            spawn3DFlash(hole.mesh.position, 0xffffff);
                            robot.pos.set(idx === 0 ? -250 : 250, 0, 0);
                            robot.velocity.set(0, 0, 0);
                            robot.invincibleTimer = 1.5;
                        }
                    });
                }

                if (currentStage >= 3 && robot.flipTimer <= 0) {
                    for (let bIndex = bombs.length - 1; bIndex >= 0; bIndex--) {
                        const bomb = bombs[bIndex];
                        if (robot.pos.distanceTo(bomb.mesh.position) < 65.0 && robot.freezeTimer <= 0 && robot.invincibleTimer <= 0) {
                            playExplosionSound();
                            spawn3DфераExplosion(bomb.mesh.position, 0xff2200, 3.5);
                            
                            robot.freezeTimer = 1.5;
                            robot.invincibleTimer = 3.0;
                            robot.flipTimer = 1.5;

                            const pushDir = new THREE.Vector3().subVectors(robot.pos, bomb.mesh.position).normalize();
                            robot.velocity.addScaledVector(pushDir, 18.0);

                            scene.remove(bomb.mesh);
                            bombs.splice(bIndex, 1);
                            break;
                        }
                    }
                }

                if (currentStage >= 4 && robot.flipTimer <= 0) {
                    enemies.forEach(en => {
                        if (robot.pos.distanceTo(en.mesh.position) < 65.0 && robot.freezeTimer <= 0 && robot.invincibleTimer <= 0) {
                            playExplosionSound();
                            spawn3DфераExplosion(en.mesh.position, 0xff0000, 3.0);

                            robot.freezeTimer = 1.5;
                            robot.invincibleTimer = 3.0;
                            robot.flipTimer = 1.5;

                            const pushDir = new THREE.Vector3().subVectors(robot.pos, en.mesh.position).normalize();
                            robot.velocity.addScaledVector(pushDir, 18.0);
                        }
                    });
                }

                if (currentStage === 5 && boss && robot.flipTimer <= 0) {
                    const distToBoss = robot.pos.distanceTo(boss.pos);
                    if (distToBoss < 130.0 && robot.freezeTimer <= 0) {
                        if (boss.hp > 0) {
                            const attackPower = 1 + robot.score;
                            boss.hp -= attackPower;
                            playPopSound();
                            spawn3DфераExplosion(boss.pos, 0xffaa00, 4.0);

                            const pushDir = new THREE.Vector3().subVectors(robot.pos, boss.pos).normalize();
                            robot.pos.addScaledVector(pushDir, 720.0);
                            robot.velocity.copy(pushDir.multiplyScalar(512.0));

                            updateBossHpBar();

                            if (boss.hp <= 0) {
                                boss.hp = 0;
                                scene.remove(boss.mesh);
                                updateBossHpBar();
                            }
                        }
                    }
                }
            });

            if (movingAny) {
                startVacuumSound();
            } else {
                stopVacuumSound();
            }

            if (robots.length > 1) {
                const r1 = robots[0];
                const r2 = robots[1];
                const dist = r1.pos.distanceTo(r2.pos);
                const minDistance = r1.radius + r2.radius;
                if (dist < minDistance) {
                    const overlap = minDistance - dist;
                    const pushDir = new THREE.Vector3().subVectors(r1.pos, r2.pos).normalize();
                    r1.pos.addScaledVector(pushDir, overlap * 0.5);
                    r2.pos.addScaledVector(pushDir, -overlap * 0.5);
                    r1.velocity.addScaledVector(pushDir, 2.0);
                    r2.velocity.addScaledVector(pushDir, -2.0);
                }
            }

            trashes.forEach(trash => {
                if (!trash.collected) {
                    robots.forEach(robot => {
                        if (robot.pos.distanceTo(trash.mesh.position) < 55.0) {
                            trash.collected = true;
                            scene.remove(trash.mesh);
                            robot.score++;
                            playPopSound();
                            updateHUD();
                        }
                    });
                }
            });

            if (robots.length > 0) {
                let centerPos = new THREE.Vector3();
                robots.forEach(r => centerPos.add(r.pos));
                centerPos.divideScalar(robots.length);

                camera.position.x += (centerPos.x - camera.position.x) * 0.06;
                camera.position.z += (centerPos.z + 600 - camera.position.z) * 0.06;
                camera.position.y = 700;
                camera.lookAt(centerPos.x, 0, centerPos.z);
            }

            const collectedCount = trashes.filter(t => t.collected).length;
            const bossBeaten = (currentStage !== 5 || (boss && boss.hp <= 0));

            if (collectedCount >= userTrashCount && bossBeaten && !isGameCleared) {
                isGameCleared = true;
                stopVacuumSound();
                showResult();
            }
        }

        function updateHUD() {
            if (playerMode === 1) {
                document.getElementById('score1Text').innerHTML = `ゴミ: ${robots[0].score} / ${userTrashCount} <span class='text-xs opacity-75'>Trash</span>`;
            } else {
                document.getElementById('score1Text').innerHTML = `1P: ${robots[0].score}`;
                document.getElementById('score2Text').innerHTML = `2P: ${robots[1].score}`;
            }
        }

        function showResult() {
            const resultScreen = document.getElementById('resultScreen');
            const resultTitle = document.getElementById('resultTitle');
            const resultSubtitle = document.getElementById('resultSubtitle');
            const resultMessage = document.getElementById('resultMessage');
            const nextBtn = document.getElementById('nextStageBtn');

            resultScreen.classList.remove('hidden');

            if (currentStage < totalStages) {
                resultTitle.innerText = `🏆 ステージ ${currentStage} クリア！`;
                resultSubtitle.innerText = `Stage ${currentStage} Cleared!`;
                resultMessage.innerText = `おめでとう！つぎのステージにすすもう！ / Great job!`;
                nextBtn.style.display = 'block';
            } else {
                resultTitle.innerText = `👑 全ステージクリア！大はんじょう！`;
                resultSubtitle.innerText = `All Stages Completed!`;
                resultMessage.innerText = `おそうじマスターだね！おめでとう！ / Cleaning Master!`;
                nextBtn.style.display = 'none';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = function() {
            initThree();
            animate();
        };
    </script>
</body>

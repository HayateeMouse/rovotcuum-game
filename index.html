<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>おそうじロボット大作戦 - 5ステージ大冒険</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; font-family: 'Inter', sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; box-sizing: border-box; }
        .interactive { pointer-events: auto; }
        
        .split-line {
            position: absolute; top: 0; left: 50%; width: 4px; height: 100%;
            background: rgba(255, 255, 255, 0.3); transform: translateX(-50%); display: none; z-index: 6;
        }

        .joystick-zone { 
            position: absolute; width: 120px; height: 120px; 
            background: rgba(255,255,255,0.2); border-radius: 50%; 
            touch-action: none; display: none; 
            justify-content: center; align-items: center; z-index: 10; 
            pointer-events: none;
        }
        .joystick-knob { 
            width: 50px; height: 50px; background: rgba(255,255,255,0.8); 
            border-radius: 50%; box-shadow: 0 4px 6px rgba(0,0,0,0.2); pointer-events: none; 
        }
    </style>
</head>
<body>

    <div id="splitLine" class="split-line"></div>

    <div class="ui-layer">
        <!-- Compact HUD Header -->
        <div id="hud" class="flex justify-between items-center w-full max-w-4xl mx-auto bg-white/90 backdrop-blur-md px-4 py-2 rounded-xl shadow-md hidden">
            <div class="flex items-center gap-2">
                <button onclick="openSettings()" class="interactive px-2.5 py-1 bg-slate-700 hover:bg-slate-800 text-white font-bold rounded-lg text-xs shadow">
                    ⚙️ せってい
                </button>
                <div id="stageIndicator" class="bg-indigo-600 text-white px-2.5 py-1 rounded-lg font-bold text-xs shadow">
                    ステージ 1
                </div>
            </div>
            
            <div id="bossHpContainer" class="hidden flex-col items-center bg-rose-100 border border-rose-500 px-3 py-0.5 rounded-lg shadow">
                <span id="bossHpText" class="text-[10px] font-black text-rose-700">👑 ボス (HP: 100/100)</span>
                <div class="w-36 bg-slate-200 h-2 rounded-full overflow-hidden mt-0.5 border border-rose-300">
                    <div id="bossHpBar" class="bg-rose-600 h-full w-full transition-all duration-200"></div>
                </div>
            </div>

            <div id="score1Container" class="flex items-center gap-2">
                <div class="w-4 h-4 rounded-full bg-slate-900 border-2 border-white shadow"></div>
                <span id="score1Text" class="text-sm font-bold text-slate-800">1P: 0</span>
            </div>
            <div id="score2Container" class="flex items-center gap-2 hidden">
                <span id="score2Text" class="text-sm font-bold text-slate-800">2P: 0</span>
                <div class="w-4 h-4 rounded-full bg-white border-2 border-slate-900 shadow"></div>
            </div>
        </div>

        <!-- Menu Screen -->
        <div id="menuScreen" class="absolute inset-0 bg-slate-900/85 backdrop-blur-sm flex flex-col justify-center items-center interactive z-30">
            <div class="bg-white p-6 rounded-2xl shadow-2xl text-center max-w-sm w-full mx-4 border-2 border-indigo-100">
                <h1 class="text-2xl font-black text-indigo-600 mb-1">🧹 おそうじロボット大作戦</h1>
                <p class="text-slate-600 mb-5 text-sm font-medium">全5ステージの大冒険！</p>
                
                <div class="flex flex-col gap-3">
                    <button onclick="startGame(1)" class="w-full py-3 bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold text-base rounded-xl shadow hover:scale-105 transition transform active:scale-95">
                        👤 1人で あそぶ
                    </button>
                    <button onclick="startGame(2)" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-base rounded-xl shadow hover:scale-105 transition transform active:scale-95">
                        👥 2人で たいせん
                    </button>
                    <button onclick="openSettings()" class="w-full py-2.5 bg-slate-200 text-slate-700 font-bold text-sm rounded-xl shadow hover:bg-slate-300 transition">
                        ⚙️ せってい
                    </button>
                </div>
            </div>
        </div>

        <!-- Settings Screen -->
        <div id="settingsScreen" class="absolute inset-0 bg-slate-900/85 backdrop-blur-sm flex flex-col justify-center items-center interactive z-30 hidden overflow-y-auto py-4">
            <div class="bg-white p-5 rounded-2xl shadow-2xl text-left max-w-sm w-full mx-4 border-2 border-slate-200">
                <h1 class="text-xl font-black text-slate-800 mb-3 text-center">⚙️ せってい画面</h1>
                
                <!-- Volume Slider -->
                <div class="mb-3">
                    <label class="block text-xs font-bold text-slate-700 mb-1">🔊 サウンド音量: <span id="volumeValue">80</span>%</label>
                    <input type="range" id="volumeSlider" min="0" max="100" value="80" oninput="updateVolume(this.value)" class="w-full accent-indigo-600 cursor-pointer">
                </div>

                <!-- Trash Count Slider -->
                <div class="mb-3">
                    <label class="block text-xs font-bold text-slate-700 mb-1">🗑️ ゴミの数 (10〜200): <span id="trashCountValue">10</span>個</label>
                    <input type="range" id="trashCountSlider" min="10" max="200" step="10" value="10" oninput="updateTrashCountSetting(this.value)" class="w-full accent-indigo-600 cursor-pointer">
                </div>

                <!-- 1P Speed -->
                <div class="mb-3">
                    <label class="block text-xs font-bold text-slate-700 mb-1">🎮 1P スピード</label>
                    <div class="grid grid-cols-3 gap-1.5">
                        <button id="p1SpeedBeginner" onclick="setSpeed(1, 'beginner')" class="py-1.5 bg-slate-100 text-slate-700 font-bold rounded-lg text-xs border border-transparent">初心者(4歳)</button>
                        <button id="p1SpeedIntermediate" onclick="setSpeed(1, 'intermediate')" class="py-1.5 bg-slate-100 text-slate-700 font-bold rounded-lg text-xs border border-transparent">中級(小学生)</button>
                        <button id="p1SpeedPro" onclick="setSpeed(1, 'pro')" class="py-1.5 bg-indigo-600 text-white font-bold rounded-lg text-xs border border-indigo-600">プロ</button>
                    </div>
                </div>

                <!-- 2P Speed -->
                <div class="mb-3">
                    <label class="block text-xs font-bold text-slate-700 mb-1">🎮 2P スピード</label>
                    <div class="grid grid-cols-3 gap-1.5">
                        <button id="p2SpeedBeginner" onclick="setSpeed(2, 'beginner')" class="py-1.5 bg-slate-100 text-slate-700 font-bold rounded-lg text-xs border border-transparent">初心者(4歳)</button>
                        <button id="p2SpeedIntermediate" onclick="setSpeed(2, 'intermediate')" class="py-1.5 bg-slate-100 text-slate-700 font-bold rounded-lg text-xs border border-transparent">中級(小学生)</button>
                        <button id="p2SpeedPro" onclick="setSpeed(2, 'pro')" class="py-1.5 bg-indigo-600 text-white font-bold rounded-lg text-xs border border-indigo-600">プロ</button>
                    </div>
                </div>

                <!-- Test Play Code Section -->
                <div class="mb-4 pt-2 border-t border-slate-200">
                    <label class="block text-[10px] font-bold text-slate-400 mb-1">🧪 テストプレイコード (6桁)</label>
                    <div class="flex gap-2 items-center">
                        <input type="password" id="secretCodeInput" maxlength="6" placeholder="******" class="w-24 px-2 py-1 border border-slate-300 rounded-lg text-center tracking-widest font-bold text-slate-700 focus:outline-none focus:border-indigo-500 text-xs">
                        <button onclick="checkSecretCode()" class="px-3 py-1 bg-slate-800 text-white font-bold rounded-lg hover:bg-slate-700 transition text-xs shadow">
                            認証
                        </button>
                    </div>
                </div>

                <button onclick="closeSettings()" class="w-full py-2.5 bg-indigo-600 text-white font-bold text-sm rounded-xl shadow hover:bg-indigo-700 transition">
                    もどる
                </button>
            </div>
        </div>

        <!-- Stage Select Screen -->
        <div id="stageSelectScreen" class="absolute inset-0 bg-slate-900/85 backdrop-blur-sm flex flex-col justify-center items-center interactive z-30 hidden">
            <div class="bg-white p-6 rounded-2xl shadow-2xl text-center max-w-sm w-full mx-4 border-2 border-amber-200">
                <h1 class="text-xl font-black text-amber-600 mb-1">🧪 ステージ選択</h1>
                <p class="text-slate-600 mb-4 text-xs font-medium">好きなステージからスタート！</p>
                <div class="grid grid-cols-1 gap-2 mb-3">
                    <button onclick="startTestStage(1)" class="py-2.5 bg-blue-500 text-white font-bold rounded-xl text-xs shadow hover:bg-blue-600">ステージ 1 (通常)</button>
                    <button onclick="startTestStage(2)" class="py-2.5 bg-indigo-500 text-white font-bold rounded-xl text-xs shadow hover:bg-indigo-600">ステージ 2 (落とし穴)</button>
                    <button onclick="startTestStage(3)" class="py-2.5 bg-amber-500 text-white font-bold rounded-xl text-xs shadow hover:bg-amber-600">ステージ 3 (爆弾)</button>
                    <button onclick="startTestStage(4)" class="py-2.5 bg-purple-500 text-white font-bold rounded-xl text-xs shadow hover:bg-purple-600">ステージ 4 (お邪魔キャラ)</button>
                    <button onclick="startTestStage(5)" class="py-2.5 bg-rose-500 text-white font-bold rounded-xl text-xs shadow hover:bg-rose-600">ステージ 5 (ボス戦)</button>
                </div>
                <button onclick="returnToMenu()" class="w-full py-2 bg-slate-600 text-white font-bold text-xs rounded-xl">メニューに戻る</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="resultScreen" class="absolute inset-0 bg-slate-900/85 backdrop-blur-sm flex flex-col justify-center items-center interactive z-30 hidden">
            <div class="bg-white p-6 rounded-2xl shadow-2xl text-center max-w-sm w-full mx-4 border-2 border-yellow-200">
                <h1 id="resultTitle" class="text-2xl font-black text-yellow-500 mb-1">🏆 ステージクリア！</h1>
                <p id="resultMessage" class="text-sm font-bold text-slate-700 mb-5">おめでとう！</p>
                <div class="flex flex-col gap-2.5">
                    <button id="nextStageBtn" onclick="nextStage()" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-base rounded-xl shadow hover:scale-105 transition">
                        ➡️ つぎのステージへ
                    </button>
                    <button onclick="returnToMenu()" class="w-full py-2.5 bg-slate-700 text-white font-bold text-sm rounded-xl shadow hover:bg-slate-800 transition">
                        🏠 メニューにもどる
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Joystick Zones -->
    <div id="joystickZone1" class="joystick-zone">
        <div id="joystickKnob1" class="joystick-knob"></div>
    </div>
    <div id="joystickZone2" class="joystick-zone">
        <div id="joystickKnob2" class="joystick-knob"></div>
    </div>

    <script>
        let audioCtx = null;
        let masterGain = null;
        let globalVolume = 0.8;
        let userTrashCount = 10;
        const arenaSize = 140; // Wider arena

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx) {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                if (!masterGain) {
                    masterGain = audioCtx.createGain();
                    masterGain.gain.setValueAtTime(globalVolume, audioCtx.currentTime);
                    masterGain.connect(audioCtx.destination);
                }
            }
        }

        function updateVolume(val) {
            globalVolume = val / 100;
            document.getElementById('volumeValue').innerText = val;
            if (masterGain && audioCtx) {
                masterGain.gain.setValueAtTime(globalVolume, audioCtx.currentTime);
            }
        }

        function updateTrashCountSetting(val) {
            userTrashCount = parseInt(val);
            document.getElementById('trashCountValue').innerText = val;
        }

        function playPopSound() {
            initAudioContext();
            if (!audioCtx || !masterGain) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
            gain.gain.setValueAtTime(0.7 * globalVolume, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.1);
        }

        function playExplosionSound() {
            initAudioContext();
            if (!audioCtx || !masterGain) return;
            const now = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 2.0;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.4));
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200, now);
            filter.frequency.linearRampToValueAtTime(60, now + 2.0);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(20.0 * globalVolume, now); // Loud explosion
            gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            noise.start(now);
        }

        function playCartoonFallSound() {
            initAudioContext();
            if (!audioCtx || !masterGain) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(900, now);
            osc.frequency.exponentialRampToValueAtTime(60, now + 0.7);

            gain.gain.setValueAtTime(1.0 * globalVolume, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.7);

            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.7);
        }

        let vacuumNode = null;
        let vacuumGain = null;
        let isVacuumPlaying = false;

        function startVacuumSound() {
            initAudioContext();
            if (!audioCtx || !masterGain || isVacuumPlaying) return;
            isVacuumPlaying = true;
            try {
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1);
                }
                vacuumNode = audioCtx.createBufferSource();
                vacuumNode.buffer = buffer;
                vacuumNode.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(5000, audioCtx.currentTime);
                filter.Q.setValueAtTime(10, audioCtx.currentTime);

                vacuumGain = audioCtx.createGain();
                vacuumGain.gain.setValueAtTime(0.7 * globalVolume, audioCtx.currentTime);

                vacuumNode.connect(filter);
                filter.connect(vacuumGain);
                vacuumGain.connect(masterGain);
                vacuumNode.start();
            } catch (e) {
                isVacuumPlaying = false;
            }
        }

        function stopVacuumSound() {
            if (!isVacuumPlaying || !vacuumNode) return;
            try {
                vacuumNode.stop();
                vacuumNode.disconnect();
            } catch (e) {}
            isVacuumPlaying = false;
            vacuumNode = null;
        }

        let scene, camera, renderer;
        let robots = [];
        let trashes = [];
        let holes = [];
        let bombs = [];
        let enemies = [];
        let boss = null;
        let fireballs = [];
        let effects = [];
        
        let keys = {};
        let activeTouches = {};
        
        let isGameStarted = false;
        let isGameCleared = false;
        let playerMode = 1;
        let currentStage = 1;
        const totalStages = 5;

        let clock = new THREE.Clock();

        let speeds = { 1: 'intermediate', 2: 'intermediate' };
        const speedValues = {
            beginner: 0.022,      // Ultra slow for 4-year-olds
            intermediate: 0.055,  // Kid-friendly smooth speed
            pro: 0.095            // Responsive pro speed
        };

        function setSpeed(playerNum, level) {
            speeds[playerNum] = level;
            ['beginner', 'intermediate', 'pro'].forEach(lvl => {
                const btn = document.getElementById(`p${playerNum}Speed${lvl.charAt(0).toUpperCase() + lvl.slice(1)}`);
                if (lvl === level) {
                    btn.className = 'py-1.5 bg-indigo-600 text-white font-bold rounded-lg text-xs border border-indigo-600';
                } else {
                    btn.className = 'py-1.5 bg-slate-100 text-slate-700 font-bold rounded-lg text-xs border border-transparent';
                }
            });
        }

        function openSettings() {
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('stageSelectScreen').classList.add('hidden');
            document.getElementById('settingsScreen').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsScreen').classList.add('hidden');
            document.getElementById('menuScreen').classList.remove('hidden');
        }

        function checkSecretCode() {
            const codeInput = document.getElementById('secretCodeInput').value;
            if (codeInput === '061606') {
                initAudioContext();
                document.getElementById('settingsScreen').classList.add('hidden');
                document.getElementById('stageSelectScreen').classList.remove('hidden');
            } else {
                alert('コードが違います');
            }
        }

        function startTestStage(stageNum) {
            initAudioContext();
            playerMode = 1;
            currentStage = stageNum;

            isGameStarted = true;
            isGameCleared = false;
            clock.start();

            document.getElementById('stageSelectScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('score2Container').classList.add('hidden');
            document.getElementById('splitLine').style.display = 'none';

            setupStage();
        }

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.FogExp2(0x1a1a2e, 0.008);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 60, 50);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 80, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createRoom();
            setupInput();

            window.addEventListener('resize', onWindowResize);
        }

        function createRoom() {
            const floorGeo = new THREE.PlaneGeometry(arenaSize, arenaSize);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x222831, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x393e46, roughness: 0.5 });
            const transWallMat = new THREE.MeshStandardMaterial({ color: 0x393e46, transparent: true, opacity: 0.15, roughness: 0.5 });
            const half = arenaSize / 2;

            const north = new THREE.Mesh(new THREE.BoxGeometry(arenaSize, 5, 1), wallMat);
            north.position.set(0, 2.5, -half);
            scene.add(north);

            const south = new THREE.Mesh(new THREE.BoxGeometry(arenaSize, 5, 1), transWallMat);
            south.position.set(0, 2.5, half);
            scene.add(south);

            const west = new THREE.Mesh(new THREE.BoxGeometry(1, 5, arenaSize), wallMat);
            west.position.set(-half, 2.5, 0);
            scene.add(west);

            const east = new THREE.Mesh(new THREE.BoxGeometry(1, 5, arenaSize), wallMat);
            east.position.set(half, 2.5, 0);
            scene.add(east);
        }

        function startGame(mode) {
            initAudioContext();
            playerMode = mode;
            currentStage = 1;

            isGameStarted = true;
            isGameCleared = false;
            clock.start();

            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');

            const splitLine = document.getElementById('splitLine');
            if (playerMode === 1) {
                document.getElementById('score2Container').classList.add('hidden');
                splitLine.style.display = 'none';
            } else {
                document.getElementById('score2Container').classList.remove('hidden');
                splitLine.style.display = 'block';
            }

            setupStage();
        }

        function nextStage() {
            currentStage++;
            if (currentStage > totalStages) {
                currentStage = totalStages;
            }
            isGameCleared = false;
            document.getElementById('resultScreen').classList.add('hidden');
            setupStage();
        }

        function returnToMenu() {
            stopVacuumSound();
            isGameStarted = false;
            isGameCleared = false;

            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('stageSelectScreen').classList.add('hidden');
            document.getElementById('settingsScreen').classList.add('hidden');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('menuScreen').classList.remove('hidden');
            document.getElementById('splitLine').style.display = 'none';
            document.getElementById('joystickZone1').style.display = 'none';
            document.getElementById('joystickZone2').style.display = 'none';

            clearStageObjects();
        }

        function clearStageObjects() {
            trashes.forEach(t => scene.remove(t.mesh));
            trashes = [];
            holes.forEach(h => scene.remove(h.mesh));
            holes = [];
            bombs.forEach(b => scene.remove(b.mesh));
            bombs = [];
            enemies.forEach(e => scene.remove(e.mesh));
            enemies = [];
            fireballs.forEach(f => scene.remove(f.mesh));
            fireballs = [];
            effects.forEach(ef => scene.remove(ef.mesh));
            effects = [];
            if (boss) {
                scene.remove(boss.mesh);
                boss = null;
            }
            document.getElementById('bossHpContainer').classList.add('hidden');
        }

        function setupStage() {
            clearStageObjects();
            document.getElementById('stageIndicator').innerText = `ステージ ${currentStage}`;

            if (currentStage === 5) {
                document.getElementById('bossHpContainer').classList.remove('hidden');
            } else {
                document.getElementById('bossHpContainer').classList.add('hidden');
            }

            robots.forEach(r => scene.remove(r.mesh));
            robots = [];
            robots.push({
                mesh: createRobotMesh(0x111111, 0x3b82f6),
                pos: new THREE.Vector3(-15, 0, 0),
                velocity: new THREE.Vector3(0, 0, 0),
                score: 0,
                id: 1,
                freezeTimer: 0,
                invincibleTimer: 0
            });
            if (playerMode === 2) {
                robots.push({
                    mesh: createRobotMesh(0xf8fafc, 0xef4444),
                    pos: new THREE.Vector3(15, 0, 0),
                    velocity: new THREE.Vector3(0, 0, 0),
                    score: 0,
                    id: 2,
                    freezeTimer: 0,
                    invincibleTimer: 0
                });
            }
            robots.forEach(r => {
                r.pos.y = 0;
                r.mesh.position.copy(r.pos);
                scene.add(r.mesh);
            });

            if (currentStage >= 2) createHoles();
            if (currentStage >= 3) createBombs();
            if (currentStage >= 4) createEnemies();
            if (currentStage === 5) createBoss();

            createTrashes();
            updateHUD();
        }

        function createRobotMesh(bodyColor, lightColor) {
            const group = new THREE.Group();
            
            const bodyGeo = new THREE.CylinderGeometry(2, 2, 0.8, 32);
            const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, metalness: 0.3, roughness: 0.4 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.4;
            body.castShadow = true;
            group.add(body);

            const bumperGeo = new THREE.TorusGeometry(2.1, 0.15, 16, 32);
            const bumperMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
            const bumper = new THREE.Mesh(bumperGeo, bumperMat);
            bumper.rotation.x = Math.PI / 2;
            bumper.position.y = 0.4;
            group.add(bumper);

            const lightGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const lightMat = new THREE.MeshBasicMaterial({ color: lightColor });
            const light = new THREE.Mesh(lightGeo, lightMat);
            light.position.set(0, 0.8, 0);
            group.add(light);

            return group;
        }

        function createHoles() {
            const holeGeo = new THREE.CylinderGeometry(4.5, 4.5, 0.1, 32);
            const holeMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });

            for (let i = 0; i < 5; i++) {
                const mesh = new THREE.Mesh(holeGeo, holeMat);
                let x, z;
                let attempts = 0;
                do {
                    x = (Math.random() - 0.5) * (arenaSize - 30);
                    z = (Math.random() - 0.5) * (arenaSize - 30);
                    attempts++;
                } while ((Math.hypot(x + 15, z) < 25 || Math.hypot(x - 15, z) < 25) && attempts < 50);

                mesh.position.set(x, 0.05, z);
                scene.add(mesh);
                holes.push({ mesh: mesh, radius: 4.2 });
            }
        }

        function createBombs() {
            const bombGroup = new THREE.Group();
            
            const bodyGeo = new THREE.SphereGeometry(1.8, 16, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.8;
            bombGroup.add(body);

            const fuseGeo = new THREE.CylinderGeometry(0.1, 0.1, 1.4, 8);
            const fuseMat = new THREE.MeshBasicMaterial({ color: 0xd97706 });
            const fuse = new THREE.Mesh(fuseGeo, fuseMat);
            fuse.position.set(0.4, 3.4, 0);
            fuse.rotation.z = -0.3;
            bombGroup.add(fuse);

            const sparkGeo = new THREE.SphereGeometry(0.5, 8, 8);
            const sparkMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
            const spark = new THREE.Mesh(sparkGeo, sparkMat);
            spark.position.set(0.8, 4.0, 0);
            bombGroup.add(spark);

            for (let i = 0; i < 6; i++) {
                const mesh = bombGroup.clone();
                let x, z;
                let attempts = 0;
                do {
                    x = (Math.random() - 0.5) * (arenaSize - 30);
                    z = (Math.random() - 0.5) * (arenaSize - 30);
                    attempts++;
                } while ((Math.hypot(x + 15, z) < 25 || Math.hypot(x - 15, z) < 25) && attempts < 50);

                mesh.position.set(x, 0, z);
                scene.add(mesh);
                bombs.push({ mesh: mesh });
            }
        }

        function createEnemies() {
            const enemyGroup = new THREE.Group();
            const bodyGeo = new THREE.SphereGeometry(1.6, 16, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.2, emissive: 0x990000 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.6;
            enemyGroup.add(body);

            // Menacing spiky sea urchin spikes
            const spikeGeo = new THREE.ConeGeometry(0.5, 2.6, 6);
            const spikeMat = new THREE.MeshStandardMaterial({ color: 0xff4444, metalness: 0.9, roughness: 0.1 });
            
            for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) {
                for (let phi = 0.4; phi <= Math.PI; phi += Math.PI / 2) {
                    const s = new THREE.Mesh(spikeGeo, spikeMat);
                    s.position.set(Math.cos(angle) * Math.sin(phi) * 1.6, 1.6 + Math.cos(phi) * 1.6, Math.sin(angle) * Math.sin(phi) * 1.6);
                    s.lookAt(s.position.clone().multiplyScalar(2));
                    enemyGroup.add(s);
                }
            }

            for (let i = 0; i < 6; i++) {
                const mesh = enemyGroup.clone();
                let x, z;
                let attempts = 0;
                do {
                    x = (Math.random() - 0.5) * (arenaSize - 30);
                    z = (Math.random() - 0.5) * (arenaSize - 30);
                    attempts++;
                } while ((Math.hypot(x + 15, z) < 25 || Math.hypot(x - 15, z) < 25) && attempts < 50);

                mesh.position.set(x, 0, z);
                scene.add(mesh);
                enemies.push({
                    mesh: mesh,
                    velocity: new THREE.Vector3((Math.random() - 0.5) * 0.45, 0, (Math.random() - 0.5) * 0.45) // Evadable speed
                });
            }
        }

        function createBoss() {
            const group = new THREE.Group();
            
            const bodyGeo = new THREE.BoxGeometry(10, 7, 14);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x7c2d12, roughness: 0.4 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 3.5;
            group.add(body);

            const headGeo = new THREE.BoxGeometry(6, 5, 8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0x9a3412, roughness: 0.3 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.set(0, 6.0, -9.0);
            group.add(head);

            const eyeGeo = new THREE.SphereGeometry(0.8, 16, 16);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-1.8, 7.0, -12);
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(1.8, 7.0, -12);
            group.add(leftEye);
            group.add(rightEye);

            group.position.set(0, 0, -45);
            scene.add(group);

            const bossMaxHp = userTrashCount * 10;
            boss = {
                mesh: group,
                hp: bossMaxHp,
                maxHp: bossMaxHp,
                pos: group.position,
                actionTimer: 0,
                fireCooldown: 0
            };
            updateBossHpBar();
        }

        function updateBossHpBar() {
            if (!boss) return;
            const pct = Math.max(0, (boss.hp / boss.maxHp) * 100);
            document.getElementById('bossHpBar').style.width = pct + '%';
            document.getElementById('bossHpText').innerText = `👑 ボス 糸くずモンスター (HP: ${Math.ceil(boss.hp)}/${boss.maxHp})`;
        }

        function createTrashes() {
            const colors = [0xef4444, 0x3b82f6, 0xeab308, 0x10b981, 0xec4899];
            const geometries = [
                () => new THREE.BoxGeometry(2.5, 2.5, 2.5),
                () => new THREE.SphereGeometry(1.6, 16, 16),
                () => new THREE.ConeGeometry(1.6, 3.0, 16)
            ];

            for (let i = 0; i < userTrashCount; i++) {
                const geoFn = geometries[Math.floor(Math.random() * geometries.length)];
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
                const mesh = new THREE.Mesh(geoFn(), mat);

                let x, z;
                let valid = false;
                let attempts = 0;
                while (!valid && attempts < 100) {
                    attempts++;
                    x = (Math.random() - 0.5) * (arenaSize - 20);
                    z = (Math.random() - 0.5) * (arenaSize - 20);
                    
                    valid = true;
                    // Check distance from holes so trash NEVER spawns on a hole
                    for (let hole of holes) {
                        if (hole.mesh.position.distanceTo(new THREE.Vector3(x, 0, z)) < hole.radius + 3.0) {
                            valid = false;
                            break;
                        }
                    }
                }

                mesh.position.set(x, 0.9, z);
                mesh.castShadow = true;

                scene.add(mesh);
                trashes.push({ mesh: mesh, collected: false });
            }
        }

        function spawn3DExplosion(pos, colorHex = 0xff3300, scale = 1.0) {
            const expGeo = new THREE.SphereGeometry(2.5 * scale, 16, 16);
            const expMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.95 });
            const mesh = new THREE.Mesh(expGeo, expMat);
            mesh.position.copy(pos);
            mesh.position.y = 1.5;
            scene.add(mesh);
            effects.push({ mesh: mesh, timer: 0.6, type: 'explosion' });
        }

        function spawn3DFlash(pos, colorHex = 0xffffff) {
            const flashGeo = new THREE.RingGeometry(0.5, 4.0, 32);
            const flashMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
            const mesh = new THREE.Mesh(flashGeo, flashMat);
            mesh.position.copy(pos);
            mesh.position.y = 0.2;
            mesh.rotation.x = -Math.PI / 2;
            scene.add(mesh);
            effects.push({ mesh: mesh, timer: 0.5, type: 'flash' });
        }

        function setupInput() {
            window.addEventListener('keydown', (e) => keys[e.code] = true);
            window.addEventListener('keyup', (e) => keys[e.code] = false);

            document.body.addEventListener('touchstart', (e) => {
                if (!isGameStarted || isGameCleared) return;
                initAudioContext();

                const screenW = window.innerWidth;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.target.tagName === 'BUTTON' || touch.target.tagName === 'INPUT') continue;

                    let zoneEl = document.getElementById('joystickZone1');
                    let knobEl = document.getElementById('joystickKnob1');

                    let player = 1;
                    if (playerMode === 2) {
                        if (touch.clientX > screenW / 2) {
                            player = 2;
                            zoneEl = document.getElementById('joystickZone2');
                            knobEl = document.getElementById('joystickKnob2');
                        }
                    } else {
                        if (touch.clientX > screenW / 2) {
                            player = 1;
                            zoneEl = document.getElementById('joystickZone1');
                            knobEl = document.getElementById('joystickKnob1');
                        }
                    }

                    if (!activeTouches[touch.identifier]) {
                        const center = { x: touch.clientX, y: touch.clientY };
                        zoneEl.style.display = 'flex';
                        zoneEl.style.left = (center.x - 60) + 'px';
                        zoneEl.style.top = (center.y - 60) + 'px';
                        knobEl.style.transform = `translate(0px, 0px)`;

                        activeTouches[touch.identifier] = { player, zoneEl, knobEl, center, deltaX: 0, deltaZ: 0 };
                        updateJoystickMove(touch, activeTouches[touch.identifier]);
                    }
                }
            }, { passive: false });

            document.body.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const info = activeTouches[touch.identifier];
                    if (info) {
                        e.preventDefault();
                        updateJoystickMove(touch, info);
                    }
                }
            }, { passive: false });

            const endTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const info = activeTouches[touch.identifier];
                    if (info) {
                        info.zoneEl.style.display = 'none';
                        delete activeTouches[touch.identifier];
                    }
                }
            };

            document.body.addEventListener('touchend', endTouch);
            document.body.addEventListener('touchcancel', endTouch);

            function updateJoystickMove(touch, info) {
                const dx = touch.clientX - info.center.x;
                const dy = touch.clientY - info.center.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const maxDist = 35;
                let nx = dx, ny = dy;
                if (dist > maxDist) {
                    nx = (dx / dist) * maxDist;
                    ny = (dy / dist) * maxDist;
                }
                info.knobEl.style.transform = `translate(${nx}px, ${ny}px)`;

                info.deltaX = dx / maxDist;
                info.deltaZ = dy / maxDist;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            let delta = clock.getDelta();
            if (delta > 0.1) delta = 0.1;

            if (isGameStarted && !isGameCleared) {
                updateGame(delta);
            }

            renderer.render(scene, camera);
        }

        function updateGame(delta) {
            const speedFactor = delta * 60;
            const friction = Math.pow(0.85, speedFactor); 
            let movingAny = false;

            for (let i = effects.length - 1; i >= 0; i--) {
                const ef = effects[i];
                ef.timer -= delta;
                if (ef.type === 'explosion') {
                    ef.mesh.scale.addScalar(delta * 12);
                    ef.mesh.material.opacity = ef.timer * 2;
                } else if (ef.type === 'flash') {
                    ef.mesh.scale.addScalar(delta * 10);
                    ef.mesh.material.opacity = ef.timer * 2;
                }
                if (ef.timer <= 0) {
                    scene.remove(ef.mesh);
                    effects.splice(i, 1);
                }
            }

            if (currentStage === 5 && boss) {
                boss.actionTimer += delta;
                boss.fireCooldown += delta;

                if (boss.actionTimer > 3.0) {
                    boss.actionTimer = 0;
                    boss.pos.x = (Math.random() - 0.5) * (arenaSize - 40);
                    boss.pos.z = (Math.random() - 0.5) * (arenaSize - 40);
                    boss.mesh.position.copy(boss.pos);
                    boss.mesh.position.y = 0;
                }

                if (boss.fireCooldown > 1.2 && boss.hp > 0) {
                    boss.fireCooldown = 0;
                    const fireballGeo = new THREE.SphereGeometry(1.6, 16, 16);
                    const fireballMat = new THREE.MeshBasicMaterial({ color: 0xf97316 });
                    const fireballMesh = new THREE.Mesh(fireballGeo, fireballMat);
                    fireballMesh.position.copy(boss.pos);
                    fireballMesh.position.y = 2.0;
                    scene.add(fireballMesh);

                    const targetPos = robots[0].pos;
                    const fireDir = new THREE.Vector3().subVectors(targetPos, boss.pos).normalize();
                    fireballs.push({ mesh: fireballMesh, velocity: fireDir.multiplyScalar(0.6) });
                }
            }

            for (let i = fireballs.length - 1; i >= 0; i--) {
                const fb = fireballs[i];
                fb.mesh.position.addScaledVector(fb.velocity, speedFactor);
                fb.mesh.position.y = 2.0;

                robots.forEach(robot => {
                    if (robot.pos.distanceTo(fb.mesh.position) < 3.5 && robot.freezeTimer <= 0 && robot.invincibleTimer <= 0) {
                        playExplosionSound();
                        spawn3DExplosion(fb.mesh.position, 0xff5500, 1.2);
                        robot.freezeTimer = 1.5;
                        robot.invincibleTimer = 3.0;

                        const pushDir = new THREE.Vector3().subVectors(robot.pos, fb.mesh.position).normalize();
                        robot.velocity.addScaledVector(pushDir, 4.0);

                        scene.remove(fb.mesh);
                        fireballs.splice(i, 1);
                    }
                });
            }

            enemies.forEach(en => {
                en.mesh.position.addScaledVector(en.velocity, speedFactor);
                en.mesh.position.y = 0;
                const limit = arenaSize / 2 - 4;
                if (Math.abs(en.mesh.position.x) > limit) en.velocity.x *= -1;
                if (Math.abs(en.mesh.position.z) > limit) en.velocity.z *= -1;
            });

            robots.forEach((robot, idx) => {
                const accelRate = speedValues[speeds[robot.id]];
                const acceleration = accelRate * speedFactor;

                robot.pos.y = 0; // Strict Y lock

                if (robot.invincibleTimer > 0) {
                    robot.invincibleTimer -= delta;
                    robot.mesh.visible = Math.floor(robot.invincibleTimer * 10) % 2 === 0;
                } else {
                    robot.mesh.visible = true;
                }

                if (robot.freezeTimer > 0) {
                    robot.freezeTimer -= delta;
                    robot.velocity.set(0, 0, 0);
                    robot.pos.y = 0;
                    robot.mesh.position.copy(robot.pos);
                    return;
                }

                let dir = new THREE.Vector3(0, 0, 0);
                if (idx === 0) {
                    if (keys['ArrowUp'] || (keys['KeyW'] && playerMode === 1)) dir.z -= 1;
                    if (keys['ArrowDown'] || (keys['KeyS'] && playerMode === 1)) dir.z += 1;
                    if (keys['ArrowLeft'] || (keys['KeyA'] && playerMode === 1)) dir.x -= 1;
                    if (keys['ArrowRight'] || (keys['KeyD'] && playerMode === 1)) dir.x += 1;
                    
                    for (let id in activeTouches) {
                        if (activeTouches[id].player === 1) {
                            dir.x += activeTouches[id].deltaX;
                            dir.z += activeTouches[id].deltaZ;
                        }
                    }
                } else if (idx === 1) {
                    if (keys['KeyW']) dir.z -= 1;
                    if (keys['KeyS']) dir.z += 1;
                    if (keys['KeyA']) dir.x -= 1;
                    if (keys['KeyD']) dir.x += 1;
                    
                    for (let id in activeTouches) {
                        if (activeTouches[id].player === 2) {
                            dir.x += activeTouches[id].deltaX;
                            dir.z += activeTouches[id].deltaZ;
                        }
                    }
                }

                if (dir.lengthSq() > 0) {
                    dir.normalize();
                    robot.velocity.addScaledVector(dir, acceleration);
                    movingAny = true;
                }

                robot.velocity.multiplyScalar(friction);
                robot.pos.addScaledVector(robot.velocity, speedFactor);
                robot.pos.y = 0;

                const limit = arenaSize / 2 - 2;
                if (robot.pos.x < -limit) { robot.pos.x = -limit; robot.velocity.x *= -0.5; }
                if (robot.pos.x > limit) { robot.pos.x = limit; robot.velocity.x *= -0.5; }
                if (robot.pos.z < -limit) { robot.pos.z = -limit; robot.velocity.z *= -0.5; }
                if (robot.pos.z > limit) { robot.pos.z = limit; robot.velocity.z *= -0.5; }

                robot.mesh.position.copy(robot.pos);

                if (currentStage >= 2) {
                    holes.forEach(hole => {
                        if (robot.pos.distanceTo(hole.mesh.position) < hole.radius && robot.invincibleTimer <= 0) {
                            playCartoonFallSound();
                            spawn3DFlash(hole.mesh.position, 0xffffff); // White flash fall effect
                            robot.pos.set(idx === 0 ? -15 : 15, 0, 0);
                            robot.velocity.set(0, 0, 0);
                            robot.invincibleTimer = 1.5;
                        }
                    });
                }

                if (currentStage >= 3) {
                    for (let bIndex = bombs.length - 1; bIndex >= 0; bIndex--) {
                        const bomb = bombs[bIndex];
                        if (robot.pos.distanceTo(bomb.mesh.position) < 3.8 && robot.freezeTimer <= 0 && robot.invincibleTimer <= 0) {
                            playExplosionSound();
                            spawn3DExplosion(bomb.mesh.position, 0xff2200, 1.5);
                            
                            robot.freezeTimer = 1.5;
                            robot.invincibleTimer = 3.0;

                            const pushDir = new THREE.Vector3().subVectors(robot.pos, bomb.mesh.position).normalize();
                            robot.velocity.addScaledVector(pushDir, 5.0);

                            scene.remove(bomb.mesh);
                            bombs.splice(bIndex, 1);
                            break;
                        }
                    }
                }

                if (currentStage >= 4) {
                    enemies.forEach(en => {
                        if (robot.pos.distanceTo(en.mesh.position) < 3.2 && robot.freezeTimer <= 0 && robot.invincibleTimer <= 0) {
                            playExplosionSound();
                            spawn3DExplosion(en.mesh.position, 0xff0000, 1.2);

                            robot.freezeTimer = 1.2;
                            robot.invincibleTimer = 2.5;

                            const pushDir = new THREE.Vector3().subVectors(robot.pos, en.mesh.position).normalize();
                            robot.velocity.addScaledVector(pushDir, 4.5);
                        }
                    });
                }

                if (currentStage === 5 && boss) {
                    const distToBoss = robot.pos.distanceTo(boss.pos);
                    if (distToBoss < 7.5 && robot.freezeTimer <= 0) {
                        if (boss.hp > 0) {
                            const attackPower = 1 + robot.score; // Trash collected increases attack power!
                            boss.hp -= attackPower;
                            playPopSound();
                            spawn3DExplosion(boss.pos, 0xffaa00, 1.5);

                            const pushDir = new THREE.Vector3().subVectors(robot.pos, boss.pos).normalize();
                            robot.velocity.addScaledVector(pushDir, 4.0);

                            updateBossHpBar();

                            if (boss.hp <= 0) {
                                boss.hp = 0;
                                scene.remove(boss.mesh);
                                updateBossHpBar();
                            }
                        }
                    }
                }
            });

            if (movingAny) {
                startVacuumSound();
            } else {
                stopVacuumSound();
            }

            if (robots.length > 1) {
                const r1 = robots[0];
                const r2 = robots[1];
                const dist = r1.pos.distanceTo(r2.pos);
                if (dist < 4.0) {
                    const pushDir = new THREE.Vector3().subVectors(r1.pos, r2.pos).normalize();
                    r1.velocity.addScaledVector(pushDir, 0.2);
                    r2.velocity.addScaledVector(pushDir, -0.2);
                }
            }

            trashes.forEach(trash => {
                if (!trash.collected) {
                    robots.forEach(robot => {
                        if (robot.pos.distanceTo(trash.mesh.position) < 3.2) {
                            trash.collected = true;
                            scene.remove(trash.mesh);
                            robot.score++;
                            playPopSound();
                            updateHUD();
                        }
                    });
                }
            });

            if (robots.length > 0) {
                let centerPos = new THREE.Vector3();
                robots.forEach(r => centerPos.add(r.pos));
                centerPos.divideScalar(robots.length);

                camera.position.x += (centerPos.x - camera.position.x) * 0.05;
                camera.position.z += (centerPos.z + 45 - camera.position.z) * 0.05;
                camera.lookAt(centerPos.x, 0, centerPos.z);
            }

            const collectedCount = trashes.filter(t => t.collected).length;
            const bossBeaten = (currentStage !== 5 || (boss && boss.hp <= 0));

            if (collectedCount >= userTrashCount && bossBeaten && !isGameCleared) {
                isGameCleared = true;
                stopVacuumSound();
                showResult();
            }
        }

        function updateHUD() {
            if (playerMode === 1) {
                document.getElementById('score1Text').innerText = `ゴミ: ${robots[0].score} / ${userTrashCount}`;
            } else {
                document.getElementById('score1Text').innerText = `1P: ${robots[0].score}`;
                document.getElementById('score2Text').innerText = `2P: ${robots[1].score}`;
            }
        }

        function showResult() {
            const resultScreen = document.getElementById('resultScreen');
            const resultTitle = document.getElementById('resultTitle');
            const resultMessage = document.getElementById('resultMessage');
            const nextBtn = document.getElementById('nextStageBtn');

            resultScreen.classList.remove('hidden');

            if (currentStage < totalStages) {
                resultTitle.innerText = `🏆 ステージ ${currentStage} クリア！`;
                resultMessage.innerText = `おめでとう！つぎのステージにすすもう！`;
                nextBtn.style.display = 'block';
            } else {
                resultTitle.innerText = `👑 全ステージクリア！大はんじょう！`;
                resultMessage.innerText = `おそうじマスターだね！おめでとう！`;
                nextBtn.style.display = 'none';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = function() {
            initThree();
            animate();
        };
    </script>
</body>
